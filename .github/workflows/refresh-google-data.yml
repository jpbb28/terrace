name: Refresh Google Data

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6am UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch ratings and hours from Google Places API
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          node scripts/fetch-ratings.js
          node scripts/refresh-hours.js

      - name: Apply ratings to terraces.ts
        run: node scripts/apply-ratings.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/terraces.ts scripts/ratings-results.json
          git diff --staged --quiet || git commit -m "chore: refresh Google ratings + hours [skip ci]"
          git push
